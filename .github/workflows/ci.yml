name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: ruff format --check .
      - run: ruff check .

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: bandit -c pyproject.toml -r widehalo/apps widehalo/config -x '*/tests/*,*/migrations/*'
      - run: pip-audit -r requirements/base.txt -r requirements/dev.txt -r requirements/prod.txt

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: widehalo
          POSTGRES_USER: widehalo_app
          POSTGRES_PASSWORD: widehalo_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U widehalo_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
        run: |
          mypy --config-file pyproject.toml \
            $(find widehalo/apps -type d -name services) \
            $(find widehalo/apps -type f -name schemas.py)

  architecture-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          cd widehalo
          python -m pytest tests/architecture -q

  tests:
    runs-on: ubuntu-latest
    needs: lint
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: widehalo
          POSTGRES_USER: widehalo_app
          POSTGRES_PASSWORD: widehalo_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U widehalo_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext
      # L'image postgres officielle fait de POSTGRES_USER un SUPERUSER, qui
      # contourne TOUJOURS le RLS (meme avec FORCE ROW LEVEL SECURITY) — sans
      # cette restriction, test_tenant_isolation.py echoue systematiquement
      # en CI (bug reel trouve : passait uniquement en local car ce role y
      # avait ete cree manuellement sans le privilege SUPERUSER). Reutilise le
      # meme script que docker-compose.yml (docker/init-db/001-roles.sql),
      # une seule source de verite pour cette restriction.
      - env:
          PGPASSWORD: widehalo_app
        run: psql -h localhost -U widehalo_app -d widehalo -f docker/init-db/001-roles.sql
      - env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          POSTGRES_HOST: localhost
          POSTGRES_USER: widehalo_app
          POSTGRES_PASSWORD: widehalo_app
          POSTGRES_DB: widehalo
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd widehalo
          python manage.py compilemessages
          python -m pytest --ignore=tests/e2e --cov=apps --cov-report=term-missing --cov-fail-under=80 -q

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: widehalo
          POSTGRES_USER: widehalo_app
          POSTGRES_PASSWORD: widehalo_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U widehalo_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext
      # Meme restriction que le job `tests` ci-dessus (cf. son commentaire) :
      # sans elle, le RLS multi-tenant est contourne par ce role superuser.
      - env:
          PGPASSWORD: widehalo_app
        run: psql -h localhost -U widehalo_app -d widehalo -f docker/init-db/001-roles.sql
      - env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          POSTGRES_HOST: localhost
          POSTGRES_USER: widehalo_app
          POSTGRES_PASSWORD: widehalo_app
          POSTGRES_DB: widehalo
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd widehalo
          python manage.py compilemessages
          python -m pytest tests/e2e -q -m playwright

  docker-build:
    runs-on: ubuntu-latest
    needs: [typecheck, architecture-tests, tests, security]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t widehalo:ci .
