name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: ruff format --check .
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: widehalo
          POSTGRES_USER: widehalo_app
          POSTGRES_PASSWORD: widehalo_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U widehalo_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
        run: |
          mypy --config-file pyproject.toml \
            $(find widehalo/apps -type d -name services) \
            $(find widehalo/apps -type f -name schemas.py)

  architecture-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          cd widehalo
          python -m pytest tests/architecture -q

  tests:
    runs-on: ubuntu-latest
    needs: lint
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: widehalo
          POSTGRES_USER: widehalo_app
          POSTGRES_PASSWORD: widehalo_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U widehalo_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          POSTGRES_HOST: localhost
          POSTGRES_USER: widehalo_app
          POSTGRES_PASSWORD: widehalo_app
          POSTGRES_DB: widehalo
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd widehalo
          python -m pytest --cov=apps --cov-report=term-missing --cov-fail-under=80 -q

  docker-build:
    runs-on: ubuntu-latest
    needs: [typecheck, architecture-tests, tests]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t widehalo:ci .
