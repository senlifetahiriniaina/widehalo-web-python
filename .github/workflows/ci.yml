name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: ruff format --check .
      - run: ruff check .

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: bandit -c pyproject.toml -r widehalo/apps widehalo/config -x '*/tests/*,*/migrations/*'
      - run: pip-audit -r requirements/base.txt -r requirements/dev.txt -r requirements/prod.txt

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: widehalo
          POSTGRES_USER: widehalo_app
          POSTGRES_PASSWORD: widehalo_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U widehalo_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
        run: |
          mypy --config-file pyproject.toml \
            $(find widehalo/apps -type d -name services) \
            $(find widehalo/apps -type f -name schemas.py)

  architecture-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          cd widehalo
          python -m pytest tests/architecture -q

  tests:
    runs-on: ubuntu-latest
    needs: lint
    services:
      db:
        image: postgres:16-alpine
        # POSTGRES_USER ici est l'identite BOOTSTRAP du cluster (role initdb,
        # OID 10) — jamais utilisee par Django. Postgres refuse categoriquement
        # de lui retirer SUPERUSER (cf. docker/init-db/001-init-app-role.sh
        # pour l'explication complete de ce bug reel, trouve en CI). Le role
        # applicatif "widehalo_app" (non-superuser, utilise par pytest ci-dessous)
        # est cree separement par l'etape ci-dessous, jamais confondu avec celui-ci.
        env:
          POSTGRES_DB: widehalo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext
      # Meme script que docker-compose.yml (docker/init-db/001-init-app-role.sh),
      # execute ici explicitement car les conteneurs de service GitHub Actions
      # demarrent avant le checkout et ne peuvent donc pas le monter automatiquement.
      # Cree le role applicatif "widehalo_app" (non-superuser) SEPAREMENT du role
      # bootstrap "postgres" ci-dessus — lire le script pour le detail du bug reel
      # que cette separation corrige (Postgres refuse de retrograder le bootstrap).
      - env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: widehalo
          APP_DB_USER: widehalo_app
          APP_DB_PASSWORD: widehalo_app
        run: bash docker/init-db/001-init-app-role.sh
      - env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          POSTGRES_HOST: localhost
          POSTGRES_USER: widehalo_app
          POSTGRES_PASSWORD: widehalo_app
          POSTGRES_DB: widehalo
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd widehalo
          python manage.py compilemessages
          python -m pytest --ignore=tests/e2e --cov=apps --cov-report=term-missing --cov-fail-under=80 -q

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    services:
      db:
        image: postgres:16-alpine
        # Cf. le commentaire equivalent du job `tests` ci-dessus.
        env:
          POSTGRES_DB: widehalo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext
      # Meme restriction que le job `tests` ci-dessus (cf. ses commentaires).
      - env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: widehalo
          APP_DB_USER: widehalo_app
          APP_DB_PASSWORD: widehalo_app
        run: bash docker/init-db/001-init-app-role.sh
      - env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          POSTGRES_HOST: localhost
          POSTGRES_USER: widehalo_app
          POSTGRES_PASSWORD: widehalo_app
          POSTGRES_DB: widehalo
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd widehalo
          python manage.py compilemessages
          python -m pytest tests/e2e -q -m playwright

  docker-build:
    runs-on: ubuntu-latest
    needs: [typecheck, architecture-tests, tests, security]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t widehalo:ci .
