services:
  db:
    image: postgres:16-alpine
    environment:
      # POSTGRES_USER/POSTGRES_PASSWORD fixent l'identite BOOTSTRAP du cluster
      # (role initdb, OID 10) — Postgres refuse categoriquement de jamais lui
      # retirer SUPERUSER (cf. commentaire de docker/init-db/001-init-app-role.sh),
      # donc ce role ne doit JAMAIS servir a l'application. APP_DB_USER/
      # APP_DB_PASSWORD (les vraies valeurs applicatives, POSTGRES_USER/
      # POSTGRES_PASSWORD de .env) sont transmis au script d'init qui cree un
      # role separe et ordinaire pour Django.
      POSTGRES_DB: ${POSTGRES_DB:-widehalo}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      APP_DB_USER: ${POSTGRES_USER:-widehalo_app}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-widehalo_app}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # bootstrap_admin (idempotent, cf. apps/core/management/commands) : cree
    # le compte admin@admin.local/admin par defaut UNE SEULE FOIS, seulement
    # sur une instance totalement fraiche (aucun utilisateur existant).
    # Volontairement uniquement ici (jamais dans docker/entrypoint.sh, execute
    # aussi par `worker`) pour ne jamais faire tourner deux fois cette
    # commande en parallele sur le meme demarrage `docker compose up`.
    command: >
      sh -c "python manage.py bootstrap_admin &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python manage.py qcluster
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:
