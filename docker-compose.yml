services:
  db:
    image: postgres:16-alpine
    environment:
      # POSTGRES_USER/POSTGRES_PASSWORD fixent l'identite BOOTSTRAP du cluster
      # (role initdb, OID 10) — Postgres refuse categoriquement de jamais lui
      # retirer SUPERUSER (cf. commentaire de docker/init-db/001-init-app-role.sh),
      # donc ce role ne doit JAMAIS servir a l'application. APP_DB_USER/
      # APP_DB_PASSWORD (les vraies valeurs applicatives, POSTGRES_USER/
      # POSTGRES_PASSWORD de .env) sont transmis au script d'init qui cree un
      # role separe et ordinaire pour Django.
      POSTGRES_DB: ${POSTGRES_DB:-widehalo}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      APP_DB_USER: ${POSTGRES_USER:-widehalo_app}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-widehalo_app}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # bootstrap_admin (idempotent, cf. apps/core/management/commands) : cree
    # le compte admin@admin.local/admin par defaut UNE SEULE FOIS, seulement
    # sur une instance totalement fraiche (aucun utilisateur existant).
    # Volontairement uniquement ici (jamais dans docker/entrypoint.sh, execute
    # aussi par `worker`) pour ne jamais faire tourner deux fois cette
    # commande en parallele sur le meme demarrage `docker compose up`.
    command: >
      sh -c "python manage.py bootstrap_admin &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python manage.py qcluster
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Module `ai`, AI8 (cf. plan) : conteneur Ollama auto-heberge, DERRIERE UN
  # PROFIL DOCKER COMPOSE OPTIONNEL — premiere utilisation de la fonctionnalite
  # "profiles" dans ce depot. `docker compose up` (sans argument) ne demarre
  # JAMAIS ce service ; seul `docker compose --profile local-ai up` l'active.
  # Coherent avec la decision actee au cadrage du chantier `ai` : l'API
  # hebergee low-cost (DeepSeek/Kimi) reste le mode recommande par defaut
  # (cf. docs/AI_MODULE.md), ce conteneur est une option pour qui dispose du
  # materiel (RAM/CPU, voire GPU) et veut une independance totale vis-a-vis
  # de tout fournisseur externe — pas une infra ajoutee au cout mensuel
  # ≤60€ deja acte au Lot 1.
  ai-runtime:
    image: ollama/ollama
    profiles: ["local-ai"]
    # OLLAMA_MODEL n'est PAS lu par l'image `ollama/ollama` elle-meme (elle
    # ne demarre aucun modele automatiquement) — variable purement
    # documentaire ici, reprise par `AI_PROVIDER_CONFIG["model"]` cote
    # application et par la commande manuelle `ollama pull "$OLLAMA_MODEL"`
    # documentee dans docs/AI_MODULE.md pour le premier demarrage. Defaut
    # disclosed : `qwen2.5:7b` (modele ouvert, raisonnablement exploitable
    # sur un CPU modeste sans GPU dedie ; `deepseek-r1:7b` est une
    # alternative plus lourde a essayer si le materiel le permet).
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    volumes:
      # Poids de modele telecharges = plusieurs Go — volume nomme pour ne
      # JAMAIS les re-telecharger a chaque redemarrage du conteneur.
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  db_data:
  ollama_data:
