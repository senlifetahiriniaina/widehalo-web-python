{% extends "base.html" %}
{% load i18n static %}
{% block title %}{% trans "Nouvel appel d'offres" %} — WideHalo{% endblock %}
{% block content %}
<div class="page-head">
  <h1>{% trans "Nouvel appel d'offres" %}</h1>
</div>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="form-field">
      <label for="date">{% trans "Date" %}</label>
      <input id="date" type="date" name="date">
    </div>
    <div class="form-field">
      <label for="deadline">{% trans "Échéance" %}</label>
      <input id="deadline" type="date" name="deadline">
    </div>
    <button type="submit"><svg class="ic ic-sm" aria-hidden="true"><use href="{% static 'icons/sprite.svg' %}#ic-plus"></use></svg> {% trans "Créer" %}</button>
  </form>
{% endblock %}
