{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Nouvel appel d'offres" %} — WideHalo{% endblock %}
{% block content %}
  <h1>{% trans "Nouvel appel d'offres" %}</h1>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="form-field">
      <label for="date">{% trans "Date" %}</label>
      <input id="date" type="date" name="date">
    </div>
    <div class="form-field">
      <label for="deadline">{% trans "Echeance" %}</label>
      <input id="deadline" type="date" name="deadline">
    </div>
    <button type="submit">{% trans "Creer" %}</button>
  </form>
{% endblock %}
