{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Nouvelle commande d'achat" %} — WideHalo{% endblock %}
{% block content %}
  <h1>{% trans "Nouvelle commande d'achat" %}</h1>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="form-field">
      <label for="partner_id">{% trans "Fournisseur (UUID)" %}</label>
      <input id="partner_id" type="text" name="partner_id" required>
    </div>
    <div class="form-field">
      <label for="date">{% trans "Date" %}</label>
      <input id="date" type="date" name="date">
    </div>
    <div class="form-field">
      <label for="date_expected">{% trans "Date prevue" %}</label>
      <input id="date_expected" type="date" name="date_expected">
    </div>
    <div class="form-field">
      <label for="origin">{% trans "Origine" %}</label>
      <select id="origin" name="origin">
        {% for value, label in origin_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-field">
      <label for="currency">{% trans "Devise" %}</label>
      <input id="currency" type="text" name="currency" value="MGA">
    </div>
    <div class="form-field">
      <label for="incoterm">{% trans "Incoterm" %}</label>
      <input id="incoterm" type="text" name="incoterm" placeholder="EXW/FOB/CIF/DAP/DDP">
    </div>
    <button type="submit">{% trans "Creer" %}</button>
  </form>
{% endblock %}
