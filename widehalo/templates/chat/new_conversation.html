{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Nouvelle conversation" %} — WideHalo{% endblock %}
{% block content %}
  <h1>{% trans "Nouvelle conversation" %}</h1>
  <form method="post">
    {% csrf_token %}
    <div class="form-field">
      <label for="other_user_id">{% trans "Avec" %}</label>
      <select id="other_user_id" name="other_user_id" required>
        {% for other_user in other_users %}
          <option value="{{ other_user.id }}">{{ other_user.email }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit">{% trans "Demarrer la conversation" %}</button>
  </form>
{% endblock %}
