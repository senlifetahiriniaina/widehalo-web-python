{% extends "base.html" %}
{% load i18n static %}
{% block title %}{% trans "Nouvelle expédition" %} — WideHalo{% endblock %}
{% block content %}
<div class="page-head">
  <h1>{% trans "Nouvelle expédition" %}</h1>
</div>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="form-field">
      <label for="origin">{% trans "Origine" %}</label>
      <input id="origin" type="text" name="origin" required>
    </div>
    <div class="form-field">
      <label for="destination">{% trans "Destination" %}</label>
      <input id="destination" type="text" name="destination" required>
    </div>
    <div class="form-field">
      <label for="carrier_id">{% trans "Transporteur" %}</label>
      <select id="carrier_id" name="carrier_id">
        <option value="">-</option>
        {% for carrier in carriers %}<option value="{{ carrier.id }}">{{ carrier.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-field">
      <label for="incoterm">{% trans "Incoterm" %}</label>
      <select id="incoterm" name="incoterm">
        <option value="">-</option>
        {% for value, label in incoterm_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
      </select>
    </div>
    <button type="submit"><svg class="ic ic-sm" aria-hidden="true"><use href="{% static 'icons/sprite.svg' %}#ic-plus"></use></svg> {% trans "Créer" %}</button>
  </form>
{% endblock %}
