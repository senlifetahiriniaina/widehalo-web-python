{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Nouveau trajet" %} — WideHalo{% endblock %}
{% block content %}
  <h1>{% trans "Nouveau trajet" %}</h1>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="form-field">
      <label for="vehicle_id">{% trans "Vehicule" %}</label>
      <select id="vehicle_id" name="vehicle_id" required>
        {% for vehicle in vehicles %}<option value="{{ vehicle.id }}">{{ vehicle.plate_number }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-field">
      <label for="driver_id">{% trans "Chauffeur" %}</label>
      <select id="driver_id" name="driver_id" required>
        {% for driver in drivers %}<option value="{{ driver.id }}">{{ driver.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-field">
      <label for="date">{% trans "Date" %}</label>
      <input id="date" type="date" name="date">
    </div>
    <div class="form-field">
      <label for="stop_addresses">{% trans "Arrets (une adresse par ligne)" %}</label>
      <textarea id="stop_addresses" name="stop_addresses" rows="5" required></textarea>
    </div>
    <button type="submit">{% trans "Creer" %}</button>
  </form>
{% endblock %}
