{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Recherche" %} — WideHalo{% endblock %}
{% block content %}
<c-breadcrumb>{% trans "Recherche" %}</c-breadcrumb>
<div class="page-head">
  <h1>{% trans "Recherche" %}</h1>
</div>
  <div class="form-field">
    <label for="instant-search">{% trans "Rechercher dans toute l'application" %}</label>
    <input id="instant-search" type="search" name="q"
           hx-get="/search/instant/" hx-trigger="keyup changed delay:300ms, search"
           hx-target="#instant-search-results" hx-swap="innerHTML"
           placeholder="{% trans 'Tapez pour rechercher…' %}" autocomplete="off">
  </div>
  <div id="instant-search-results"></div>
{% endblock %}
