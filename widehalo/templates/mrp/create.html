{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Nouvel ordre de fabrication" %} — WideHalo{% endblock %}
{% block content %}
  <h1>{% trans "Nouvel ordre de fabrication" %}</h1>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="form-field">
      <label for="bom_id">{% trans "Nomenclature" %}</label>
      <select id="bom_id" name="bom_id" required>
        {% for bom in boms %}
          <option value="{{ bom.id }}">{{ bom.code }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-field">
      <label for="workshop_id">{% trans "Atelier" %}</label>
      <select id="workshop_id" name="workshop_id" required>
        {% for workshop in workshops %}
          <option value="{{ workshop.id }}">{{ workshop.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-field">
      <label for="qty">{% trans "Quantite" %}</label>
      <input id="qty" type="number" name="qty" step="0.0001" min="0" value="1" required>
    </div>
    <button type="submit">{% trans "Creer l ordre" %}</button>
  </form>
{% endblock %}
