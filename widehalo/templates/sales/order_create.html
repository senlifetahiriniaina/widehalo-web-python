{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Nouvelle commande" %} — WideHalo{% endblock %}
{% block content %}
  <h1>{% trans "Nouvelle commande" %}</h1>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="form-field">
      <label for="partner_id">{% trans "Partenaire (UUID)" %}</label>
      <input id="partner_id" type="text" name="partner_id" required>
    </div>
    <div class="form-field">
      <label for="contact">{% trans "Contact" %}</label>
      <input id="contact" type="text" name="contact">
    </div>
    <div class="form-field">
      <label for="date">{% trans "Date" %}</label>
      <input id="date" type="date" name="date">
    </div>
    <div class="form-field">
      <label for="is_export"><input id="is_export" type="checkbox" name="is_export"> {% trans "Commande a l'export" %}</label>
    </div>
    <div class="form-field">
      <label for="incoterm">{% trans "Incoterm" %}</label>
      <input id="incoterm" type="text" name="incoterm" placeholder="EXW/FOB/CIF/DAP/DDP">
    </div>
    <button type="submit">{% trans "Creer" %}</button>
  </form>
{% endblock %}
