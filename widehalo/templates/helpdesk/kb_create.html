{% extends "base.html" %}
{% load i18n static %}
{% block title %}{% trans "Nouvel article" %} — WideHalo{% endblock %}
{% block content %}
<div class="page-head">
  <h1>{% trans "Nouvel article" %}</h1>
</div>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="form-field">
      <label for="title">{% trans "Titre" %}</label>
      <input id="title" type="text" name="title" required>
    </div>
    <div class="form-field">
      <label for="category_id">{% trans "Catégorie" %}</label>
      <select id="category_id" name="category_id">
        <option value="">{% trans "Aucune" %}</option>
        {% for category in categories %}
          <option value="{{ category.id }}">{{ category.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-field">
      <label for="body">{% trans "Contenu" %}</label>
      <textarea id="body" name="body" rows="10"></textarea>
    </div>
    <div class="form-field">
      <label><input type="checkbox" name="is_published"> {% trans "Publier immédiatement" %}</label>
    </div>
    <button type="submit"><svg class="ic ic-sm" aria-hidden="true"><use href="{% static 'icons/sprite.svg' %}#ic-plus"></use></svg> {% trans "Créer" %}</button>
  </form>
{% endblock %}
