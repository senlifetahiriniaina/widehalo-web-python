{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Rapports comptables" %} — WideHalo{% endblock %}
{% block content %}
  <h1>{% trans "Rapports comptables" %}</h1>

  <section>
    <h2>{% trans "Balance generale" %}</h2>
    <form method="get" action="{% url 'accounting:report_trial_balance' %}">
      <label>{% trans "Exercice fiscal" %}
        <select name="fiscal_year_id" required>
          {% for fiscal_year in fiscal_years %}
            <option value="{{ fiscal_year.id }}">{{ fiscal_year.code }}</option>
          {% endfor %}
        </select>
      </label>
      <label>{% trans "Format" %}
        <select name="format">
          <option value="json">JSON</option>
          <option value="csv">CSV</option>
          <option value="xlsx">XLSX</option>
        </select>
      </label>
      <button type="submit">{% trans "Telecharger" %}</button>
    </form>
  </section>

  <section>
    <h2>{% trans "Grand livre" %}</h2>
    <form method="get" action="{% url 'accounting:report_general_ledger' %}">
      <label>{% trans "Compte" %}
        <select name="account_id" required>
          {% for account in accounts %}
            <option value="{{ account.id }}">{{ account.code }} — {{ account.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label>{% trans "Exercice fiscal" %}
        <select name="fiscal_year_id" required>
          {% for fiscal_year in fiscal_years %}
            <option value="{{ fiscal_year.id }}">{{ fiscal_year.code }}</option>
          {% endfor %}
        </select>
      </label>
      <label>{% trans "Format" %}
        <select name="format">
          <option value="json">JSON</option>
          <option value="csv">CSV</option>
          <option value="xlsx">XLSX</option>
        </select>
      </label>
      <button type="submit">{% trans "Telecharger" %}</button>
    </form>
  </section>

  <section>
    <h2>{% trans "Journal" %}</h2>
    <form method="get" action="{% url 'accounting:report_journal' %}">
      <label>{% trans "Journal" %}
        <select name="journal_id" required>
          {% for journal in journals %}
            <option value="{{ journal.id }}">{{ journal.code }} — {{ journal.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label>{% trans "Exercice fiscal" %}
        <select name="fiscal_year_id" required>
          {% for fiscal_year in fiscal_years %}
            <option value="{{ fiscal_year.id }}">{{ fiscal_year.code }}</option>
          {% endfor %}
        </select>
      </label>
      <label>{% trans "Format" %}
        <select name="format">
          <option value="json">JSON</option>
          <option value="csv">CSV</option>
          <option value="xlsx">XLSX</option>
        </select>
      </label>
      <button type="submit">{% trans "Telecharger" %}</button>
    </form>
  </section>
{% endblock %}
