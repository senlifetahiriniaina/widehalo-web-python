{% extends "base.html" %}
{% load i18n static %}
{% block title %}{% trans "Nouvelle facture" %} — WideHalo{% endblock %}
{% block content %}
  <div class="page-head">
    <h1>{% trans "Nouvelle facture client" %}</h1>
  </div>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="form-field">
      <label for="journal_id">{% trans "Journal" %}</label>
      <select id="journal_id" name="journal_id" required>
        {% for journal in journals %}
          <option value="{{ journal.id }}">{{ journal.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-field">
      <label for="date">{% trans "Date" %}</label>
      <input id="date" type="date" name="date" value="{{ today|date:'Y-m-d' }}" required>
    </div>
    <div class="form-field">
      <label for="receivable_account_id">{% trans "Compte client" %}</label>
      <select id="receivable_account_id" name="receivable_account_id" required>
        {% for account in accounts %}
          <option value="{{ account.id }}">{{ account.code }} — {{ account.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-field">
      <label for="income_account_id">{% trans "Compte produit" %}</label>
      <select id="income_account_id" name="income_account_id" required>
        {% for account in accounts %}
          <option value="{{ account.id }}">{{ account.code }} — {{ account.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-field">
      <label for="label">{% trans "Libelle" %}</label>
      <input id="label" type="text" name="label">
    </div>
    <div class="form-field">
      <label for="amount">{% trans "Montant (MGA)" %}</label>
      <input id="amount" type="number" name="amount" step="0.0001" min="0" required>
    </div>
    <button type="submit"><svg class="ic ic-sm" aria-hidden="true"><use href="{% static 'icons/sprite.svg' %}#ic-plus"></use></svg> {% trans "Creer la facture" %}</button>
  </form>
{% endblock %}
