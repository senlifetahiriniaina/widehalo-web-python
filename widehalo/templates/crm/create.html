{% extends "base.html" %}
{% load i18n static %}
{% block title %}{% trans "Nouvelle opportunité" %} — WideHalo{% endblock %}
{% block content %}
  <div class="page-head">
    <h1>{% trans "Nouvelle opportunité" %}</h1>
  </div>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="form-field">
      <label for="name">{% trans "Nom" %}</label>
      <input id="name" type="text" name="name" required>
    </div>
    <button type="submit"><svg class="ic ic-sm" aria-hidden="true"><use href="{% static 'icons/sprite.svg' %}#ic-plus"></use></svg> {% trans "Créer" %}</button>
  </form>
{% endblock %}
