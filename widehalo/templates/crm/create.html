{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Nouvelle opportunite" %} — WideHalo{% endblock %}
{% block content %}
  <h1>{% trans "Nouvelle opportunite" %}</h1>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="form-field">
      <label for="name">{% trans "Nom" %}</label>
      <input id="name" type="text" name="name" required>
    </div>
    <button type="submit">{% trans "Creer" %}</button>
  </form>
{% endblock %}
