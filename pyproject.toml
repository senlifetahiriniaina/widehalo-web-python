[project]
name = "widehalo"
version = "0.1.0"
description = "WideHalo ERP - nouvelle generation (Python/Django)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "DJ", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101", "S105", "S106"]
"*/tests_*.py" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.bandit]
# B101 (assert_used) : "assert" est utilise dans ce depot exclusivement pour
# le narrowing mypy APRES qu'une garde reelle (filtre queryset __isnull=False,
# verification explicite) a deja garanti la condition a l'execution — jamais
# comme mecanisme d'application d'une regle metier/securite (qui utilise
# toujours ValidationError/PermissionDenied, jamais assert). Documente au cas
# par cas dans le code (cf. commentaires "garanti par ... ci-dessus"), inutile
# de repeter un "# nosec" a chaque occurrence future de ce meme patron etabli.
# B105 (hardcoded_password_string) : mots de passe de comptes de DEMONSTRATION
# uniquement (commandes seed_*), deja annotes `# noqa: S105` cote ruff — jamais
# un secret de production. Meme raisonnement, evite de dupliquer l'annotation
# pour chaque nouvelle commande seed_<module> a venir.
skips = ["B101", "B105"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
mypy_path = "widehalo"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
strict = false

[[tool.mypy.overrides]]
module = "apps.*.services.*"
strict = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "apps.*.schemas"
strict = true
disallow_untyped_defs = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests_*.py"]
addopts = "-ra -m 'not slow'"
asyncio_mode = "auto"
pythonpath = ["widehalo"]
markers = [
    "slow: tests longs (ex. portabilité tenant) exécutés en nightly, pas en CI standard",
    "playwright: tests e2e navigateur reel (couche 1, §8 du CDC) — necessitent Chromium",
]
