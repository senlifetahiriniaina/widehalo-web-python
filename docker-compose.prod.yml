services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Cf. le commentaire equivalent de docker-compose.yml et de
      # docker/init-db/001-init-app-role.sh : POSTGRES_USER/PASSWORD est
      # l'identite bootstrap du cluster (jamais utilisee par l'app), distincte
      # d'APP_DB_USER/APP_DB_PASSWORD (role applicatif reellement cree, memes
      # valeurs que POSTGRES_USER/POSTGRES_PASSWORD de .env).
      POSTGRES_DB: ${POSTGRES_DB:-widehalo}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      APP_DB_USER: ${POSTGRES_USER:-widehalo_app}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-widehalo_app}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    # Pas de port publie sur l'hote : seuls web/worker (memes reseau Docker
    # interne) accedent a Postgres, jamais l'exterieur du VM.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # daphne (ASGI), pas gunicorn (WSGI) : le socle expose deja une messagerie
    # temps reel WebSocket (apps/chat, cf. config/asgi.py) qui a besoin d'un
    # serveur ASGI pour fonctionner en production, pas seulement en dev
    # (runserver). collectstatic avant de servir : Caddy sert /static/ et
    # /media/ directement depuis les volumes partages ci-dessous (pas de
    # dependance whitenoise, aucune n'est en place dans ce socle).
    # bootstrap_admin (idempotent) : cree admin@admin.local/admin UNE SEULE
    # FOIS sur une instance fraiche — jamais dans docker/entrypoint.sh
    # (execute aussi par `worker`), pour eviter deux executions paralleles.
    # sync_scheduled_commands (idempotent) : aligne l'ordonnanceur sur le
    # registre des traitements periodiques (L0-3). Ici et pas dans
    # l'entrypoint pour la MEME raison que bootstrap_admin — deux
    # executions concurrentes (web + worker) dupliqueraient les
    # planifications, `django_q.Schedule.name` n'etant pas unique en base.
    # Ici et pas dans `AppConfig.ready()` non plus : ecrire en base au
    # chargement des applications casserait `migrate` sur une base neuve.
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py bootstrap_admin &&
             python manage.py sync_scheduled_commands &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - static_data:/app/staticfiles
      # MEDIA_ROOT (config/settings/base.py) resout a REPO_ROOT/data/media,
      # soit /app/data/media (REPO_ROOT = /app, un niveau au-dessus de
      # widehalo/) — jamais /app/widehalo/data/media. Un mauvais chemin ici
      # ecrirait les medias uploades hors du volume partage avec caddy
      # (:/srv/media), les rendant invisibles/perdus a la recreation du
      # conteneur.
      - media_data:/app/data/media
    env_file: .env
    # Force les reglages prod quoi que contienne .env (une variable
    # `environment:` de Compose prime toujours sur `env_file:`) — evite
    # qu'un `.env` cree a partir de `.env.example` sans avoir change sa
    # toute premiere ligne (DJANGO_SETTINGS_MODULE=config.settings.dev par
    # defaut) ne fasse tourner la prod avec DEBUG=True + debug_toolbar
    # actif (deja rencontre reellement sur un deploiement). config.settings.
    # dev/test restent les seuls modules autorises a etre selectionnes
    # via .env, jamais ce fichier de production.
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Sans ce healthcheck, `caddy` (depends_on: web, condition:
    # service_healthy ci-dessous) demarrerait des que le PROCESSUS web
    # demarre, pas quand daphne ecoute reellement sur :8000 — la sequence
    # complete (compilemessages/migrate deja faits par l'entrypoint, puis
    # collectstatic + bootstrap_admin + bind daphne) peut prendre plusieurs
    # dizaines de secondes, causant des 502 "connection refused" cote
    # Caddy pendant toute cette fenetre. python (deja dans l'image, aucune
    # dependance supplementaire) suffit, /api/v1/health/live ne verifie
    # meme pas la DB/Redis (deja garantis par les conditions ci-dessus) —
    # juste que daphne repond.
    # X-Forwarded-Proto: https est indispensable ici : config/settings/prod.py
    # active SECURE_SSL_REDIRECT, et ce healthcheck interroge web directement
    # sur le reseau Docker interne, sans passer par Caddy (qui pose cet
    # en-tete en conditions reelles) — sans lui, Django repond 301 (jamais
    # 200), urllib suit la redirection vers https://localhost:8000/... qui
    # echoue immediatement (daphne ne parle pas TLS sur ce port), et web
    # reste marque unhealthy indefiniment meme quand l'application tourne
    # normalement (bug reellement rencontre en production).
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/api/v1/health/live', headers={'X-Forwarded-Proto': 'https'}), timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: python manage.py qcluster
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WIDEHALO_DOMAIN: ${WIDEHALO_DOMAIN:?WIDEHALO_DOMAIN doit etre defini dans .env, ex. app.widehalo.cloud}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL doit etre defini dans .env, requis par Let's Encrypt}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  db_data:
  static_data:
  media_data:
  caddy_data:
  caddy_config:
