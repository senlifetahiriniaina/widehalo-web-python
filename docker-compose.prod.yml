services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Cf. le commentaire equivalent de docker-compose.yml et de
      # docker/init-db/001-init-app-role.sh : POSTGRES_USER/PASSWORD est
      # l'identite bootstrap du cluster (jamais utilisee par l'app), distincte
      # d'APP_DB_USER/APP_DB_PASSWORD (role applicatif reellement cree, memes
      # valeurs que POSTGRES_USER/POSTGRES_PASSWORD de .env).
      POSTGRES_DB: ${POSTGRES_DB:-widehalo}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      APP_DB_USER: ${POSTGRES_USER:-widehalo_app}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-widehalo_app}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    # Pas de port publie sur l'hote : seuls web/worker (memes reseau Docker
    # interne) accedent a Postgres, jamais l'exterieur du VM.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # daphne (ASGI), pas gunicorn (WSGI) : le socle expose deja une messagerie
    # temps reel WebSocket (apps/chat, cf. config/asgi.py) qui a besoin d'un
    # serveur ASGI pour fonctionner en production, pas seulement en dev
    # (runserver). collectstatic avant de servir : Caddy sert /static/ et
    # /media/ directement depuis les volumes partages ci-dessous (pas de
    # dependance whitenoise, aucune n'est en place dans ce socle).
    # bootstrap_admin (idempotent) : cree admin@admin.local/admin UNE SEULE
    # FOIS sur une instance fraiche — jamais dans docker/entrypoint.sh
    # (execute aussi par `worker`), pour eviter deux executions paralleles.
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py bootstrap_admin &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/widehalo/data/media
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Sans ce healthcheck, `caddy` (depends_on: web, condition:
    # service_healthy ci-dessous) demarrerait des que le PROCESSUS web
    # demarre, pas quand daphne ecoute reellement sur :8000 — la sequence
    # complete (compilemessages/migrate deja faits par l'entrypoint, puis
    # collectstatic + bootstrap_admin + bind daphne) peut prendre plusieurs
    # dizaines de secondes, causant des 502 "connection refused" cote
    # Caddy pendant toute cette fenetre. python (deja dans l'image, aucune
    # dependance supplementaire) suffit, /api/v1/health/live ne verifie
    # meme pas la DB/Redis (deja garantis par les conditions ci-dessus) —
    # juste que daphne repond.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: python manage.py qcluster
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WIDEHALO_DOMAIN: ${WIDEHALO_DOMAIN:?WIDEHALO_DOMAIN doit etre defini dans .env, ex. app.widehalo.cloud}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL doit etre defini dans .env, requis par Let's Encrypt}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  db_data:
  static_data:
  media_data:
  caddy_data:
  caddy_config:
